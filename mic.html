<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <p id="log"></p>
    <p><button id="start" onclick="start()">Start</button></p>
    <script>

      function start() {
        navigator.mediaDevices.getUserMedia({
            audio: true
        }).catch(function(e) { document.querySelector('#count').innerHTML = e.toString(); } 
      }
    </script>
</body>
</html>
