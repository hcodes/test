<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
</head>
<body>
    <script>
        //var label = document.querySelector('#label');
        setInterval(() => {
            var input = document.createElement('input');
            input.type = 'checkbox';
            input.setAttribute('switch', '');
            document.body.appendChild(input);
            input.click();
            setTimeout(() => {
                document.body.removeChild(input);
            }, 100);
        }, 1000);
    </script>
</body>
</html>
