<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <p>Input: <label id="label"><input type="checkbox" switch /></label></p>
    <p id="count"></p>
    <p><button id="start">Start 50</button></p>
    <p><button id="start2">Start 100</button></p>
    <script>

        let count = 0;
        function haptic() {
            const labelEl = document.createElement("label");
            labelEl.ariaHidden = "true";
            labelEl.style.display = "none";

            const inputEl = document.createElement("input");
            inputEl.type = "checkbox";
            inputEl.setAttribute("switch", "");
            labelEl.appendChild(inputEl);

            document.head.appendChild(labelEl);
            labelEl.click();
            document.head.removeChild(labelEl);
        }

        var button = document.querySelector('#start');
        var button2 = document.querySelector('#start2');

        function update() {
            setTimeout(() => {
                haptic();
                count++;
                document.querySelector('#count').innerText += 1;
                update();
            }, 50);
        }

        function update2() {
            setTimeout(() => {
                haptic();
                count++;
                document.querySelector('#count').innerText += 1;
                update2();
            }, 100);
        }

        button.onclick = () => {
            update();
        };

        button2.onclick = () => {
            update2();
        };
    </script>
</body>
</html>
