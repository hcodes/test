<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pencil - Top View</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        Наклоните устройство или используйте мышь<br>
        TiltX: <span id="tiltX">0</span>°<br>
        TiltY: <span id="tiltY">0</span>°
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            alpha: false // Отключаем прозрачность рендерера
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Освещение (более яркое для вида сверху)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(0, 1, 0); // Свет сверху
        scene.add(directionalLight);

        // Создание 3D карандаша
        const pencilGroup = new THREE.Group();
        scene.add(pencilGroup);

        // Параметры карандаша
        const length = 3;
        const radius = 0.15;
        const tipLength = 0.5;

        // Деревянная часть с заострением
        const woodGeometry = new THREE.CylinderGeometry(
            radius * 0.1, // Верхний радиус (острый конец)
            radius,       // Нижний радиус
            tipLength,    // Длина заостренной части
            6            // Количество сторон
        );
        woodGeometry.translate(0, -length/2 + tipLength/2, 0);
        
        const woodMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xDEB887, // Деревянный цвет
            transparent: false, // Явно отключаем прозрачность
            opacity: 1.0,    // Полная непрозрачность
            shininess: 30
        });
        const woodPart = new THREE.Mesh(woodGeometry, woodMaterial);
        pencilGroup.add(woodPart);

        // Основная деревянная часть
        const mainWoodGeometry = new THREE.CylinderGeometry(
            radius, radius, length - tipLength, 6
        );
        mainWoodGeometry.translate(0, tipLength/2, 0);
        
        const mainWoodPart = new THREE.Mesh(mainWoodGeometry, woodMaterial);
        pencilGroup.add(mainWoodPart);

        // Графитовый стержень (конус)
        const graphiteGeometry = new THREE.ConeGeometry(
            0.02,       // Радиус основания
            0.2,        // Высота
            8           // Количество сторон
        );
        graphiteGeometry.translate(0, -length/2, 0);
        const graphiteMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x222222,
            transparent: false,
            shininess: 100
        });
        const graphitePart = new THREE.Mesh(graphiteGeometry, graphiteMaterial);
        pencilGroup.add(graphitePart);

        // Металлическая обжимка
        const metalGeometry = new THREE.CylinderGeometry(
            radius, radius, 0.2, 6
        );
        metalGeometry.translate(0, length/2 - 0.5, 0);
        const metalMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xC0C0C0,
            transparent: false,
            shininess: 100,
            specular: 0xFFFFFF
        });
        const metalPart = new THREE.Mesh(metalGeometry, metalMaterial);
        pencilGroup.add(metalPart);

        // Ластик
        const eraserGeometry = new THREE.CylinderGeometry(
            radius, radius, 0.4, 6
        );
        eraserGeometry.translate(0, length/2 - 0.2, 0);
        const eraserMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xFF69B4,
            transparent: false,
            shininess: 10
        });
        const eraserPart = new THREE.Mesh(eraserGeometry, eraserMaterial);
        pencilGroup.add(eraserPart);

        // Поверхность (стол)
        const tableGeometry = new THREE.PlaneGeometry(10, 10);
        const tableMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xdddddd,
            roughness: 0.8
        });
        const table = new THREE.Mesh(tableGeometry, tableMaterial);
        table.rotation.x = -Math.PI / 2;
        table.position.y = -length/2;
        scene.add(table);

        // Настройка камеры (вид сверху)
        camera.position.set(0, 2, 0);
        camera.lookAt(0, 0, 0);
        camera.up.set(0, 0, -1); // Ось Z направлена вниз для правильного вида сверху

        // Обработка наклонов
        let targetRotationX = 0;
        let targetRotationZ = 0;
        const rotationSpeed = 0.1;
        const maxTilt = 25; // Максимальный угол наклона

        function handleTilt(event) {
            let tiltX = 0, tiltY = 0;
            
            if (event.tiltX !== undefined && event.tiltY !== undefined) {
                tiltX = event.tiltX;
                tiltY = event.tiltY;
            } else {
                // Альтернативное управление мышью
                tiltX = (event.clientX / window.innerWidth - 0.5) * 2 * maxTilt;
                tiltY = -(event.clientY / window.innerHeight - 0.5) * 2 * maxTilt;
            }
            
            document.getElementById('tiltX').textContent = tiltX.toFixed(1);
            document.getElementById('tiltY').textContent = tiltY.toFixed(1);
            
            // Ограничиваем угол наклона
            tiltX = Math.max(-maxTilt, Math.min(maxTilt, tiltX));
            tiltY = Math.max(-maxTilt, Math.min(maxTilt, tiltY));
            
            // Преобразуем в радианы
            targetRotationZ = -tiltX * (Math.PI / 180);
            targetRotationX = tiltY * (Math.PI / 180);
        }

        document.addEventListener('pointermove', handleTilt);
        document.addEventListener('mousemove', handleTilt);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            
            // Плавное вращение
            pencilGroup.rotation.x += (targetRotationX - pencilGroup.rotation.x) * rotationSpeed;
            pencilGroup.rotation.z += (targetRotationZ - pencilGroup.rotation.z) * rotationSpeed;
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
