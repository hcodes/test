<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pencil with Tilt Control</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        Наклоните устройство или используйте мышь (если поддерживается)<br>
        TiltX: <span id="tiltX">0</span>°<br>
        TiltY: <span id="tiltY">0</span>°
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);

        // Создание 3D карандаша
        const pencilGroup = new THREE.Group();
        scene.add(pencilGroup);

        // Деревянная часть карандаша
        const woodGeometry = new THREE.CylinderGeometry(0.1, 0.1, 2, 6);
        const woodMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xDEB887,
            shininess: 30
        });
        const woodPart = new THREE.Mesh(woodGeometry, woodMaterial);
        woodPart.position.y = 1;
        pencilGroup.add(woodPart);

        // Графитовая часть карандаша
        const graphiteGeometry = new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8);
        const graphiteMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x333333,
            shininess: 100
        });
        const graphitePart = new THREE.Mesh(graphiteGeometry, graphiteMaterial);
        graphitePart.position.y = 0.1;
        pencilGroup.add(graphitePart);

        // Металлическая часть карандаша
        const metalGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.2, 6);
        const metalMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xC0C0C0,
            shininess: 100,
            specular: 0xFFFFFF
        });
        const metalPart = new THREE.Mesh(metalGeometry, metalMaterial);
        metalPart.position.y = 0;
        pencilGroup.add(metalPart);

        // Ластик
        const eraserGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.3, 6);
        const eraserMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xFF69B4,
            shininess: 10
        });
        const eraserPart = new THREE.Mesh(eraserGeometry, eraserMaterial);
        eraserPart.position.y = -0.15;
        pencilGroup.add(eraserPart);

        // Позиция камеры
        camera.position.z = 3;

        // Обработка событий наклона
        let targetRotationX = 0;
        let targetRotationZ = 0;
        const rotationSpeed = 0.05;

        function handleTilt(event) {
            // Обновляем значения tiltX и tiltY в интерфейсе
            document.getElementById('tiltX').textContent = event.tiltX !== undefined ? event.tiltX.toFixed(1) : 'N/A';
            document.getElementById('tiltY').textContent = event.tiltY !== undefined ? event.tiltY.toFixed(1) : 'N/A';
            
            // Если tiltX и tiltY доступны, используем их
            if (event.tiltX !== undefined && event.tiltY !== undefined) {
                // Преобразуем градусы в радианы и инвертируем для более естественного движения
                targetRotationZ = -event.tiltX * (Math.PI / 180);
                targetRotationX = event.tiltY * (Math.PI / 180);
            } else {
                // Альтернативное управление мышью (если tilt не поддерживается)
                targetRotationX = (event.clientY / window.innerHeight - 0.5) * Math.PI;
                targetRotationZ = -(event.clientX / window.innerWidth - 0.5) * Math.PI;
            }
        }

        // Добавляем обработчики событий
        document.addEventListener('pointermove', handleTilt);
        
        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            
            // Плавное изменение вращения
            pencilGroup.rotation.x += (targetRotationX - pencilGroup.rotation.x) * rotationSpeed;
            pencilGroup.rotation.z += (targetRotationZ - pencilGroup.rotation.z) * rotationSpeed;
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
