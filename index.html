<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pencil Standing on Graphite</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        Наклоните устройство или используйте мышь<br>
        TiltX: <span id="tiltX">0</span>°<br>
        TiltY: <span id="tiltY">0</span>°
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(3, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);

        // Создание 3D карандаша
        const pencilGroup = new THREE.Group();
        pencilGroup.position.y = 0.5; // Поднимаем карандаш, чтобы он стоял на грифеле
        scene.add(pencilGroup);

        // Деревянная часть карандаша (с заострением)
        const woodLength = 2;
        const woodRadius = 0.1;
        
        // Создаем заостренную часть с помощью BufferGeometry
        const woodGeometry = new THREE.CylinderGeometry(woodRadius * 0.1, woodRadius, woodLength * 0.2, 6);
        woodGeometry.translate(0, -woodLength * 0.4, 0); // Смещаем вниз
        
        // Основная деревянная часть
        const woodMainGeometry = new THREE.CylinderGeometry(woodRadius, woodRadius, woodLength * 0.8, 6);
        woodMainGeometry.translate(0, woodLength * 0.3, 0); // Смещаем вверх
        
        // Объединяем геометрии
        const woodFullGeometry = new THREE.BufferGeometry();
        woodFullGeometry.merge(woodGeometry);
        woodFullGeometry.merge(woodMainGeometry);
        
        const woodMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xDEB887,
            shininess: 30
        });
        const woodPart = new THREE.Mesh(woodFullGeometry, woodMaterial);
        pencilGroup.add(woodPart);

        // Графитовый стержень (очень тонкий и острый)
        const graphiteGeometry = new THREE.ConeGeometry(0.01, 0.2, 8);
        graphiteGeometry.translate(0, -woodLength * 0.5 - 0.1, 0); // Размещаем в самом низу
        const graphiteMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x222222,
            shininess: 100
        });
        const graphitePart = new THREE.Mesh(graphiteGeometry, graphiteMaterial);
        pencilGroup.add(graphitePart);

        // Металлическая часть (обжимка)
        const metalGeometry = new THREE.CylinderGeometry(woodRadius, woodRadius, 0.2, 6);
        metalGeometry.translate(0, woodLength * 0.4, 0);
        const metalMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xC0C0C0,
            shininess: 100,
            specular: 0xFFFFFF
        });
        const metalPart = new THREE.Mesh(metalGeometry, metalMaterial);
        pencilGroup.add(metalPart);

        // Ластик
        const eraserGeometry = new THREE.CylinderGeometry(woodRadius, woodRadius, 0.3, 6);
        eraserGeometry.translate(0, woodLength * 0.5 + 0.15, 0);
        const eraserMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xFF69B4,
            shininess: 10
        });
        const eraserPart = new THREE.Mesh(eraserGeometry, eraserMaterial);
        pencilGroup.add(eraserPart);

        // Поверхность, на которой стоит карандаш
        const groundGeometry = new THREE.PlaneGeometry(10, 10);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xdddddd,
            roughness: 0.8
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        // Позиция камеры
        camera.position.set(2, 1.5, 3);
        camera.lookAt(0, 0.5, 0);

        // Обработка событий наклона
        let targetRotationX = 0;
        let targetRotationZ = 0;
        const rotationSpeed = 0.1;
        const maxTilt = 30; // Максимальный угол наклона в градусах

        function handleTilt(event) {
            // Обновляем значения tiltX и tiltY в интерфейсе
            const tiltX = event.tiltX || 0;
            const tiltY = event.tiltY || 0;
            document.getElementById('tiltX').textContent = tiltX.toFixed(1);
            document.getElementById('tiltY').textContent = tiltY.toFixed(1);
            
            // Ограничиваем максимальный наклон
            const clampedTiltX = Math.max(-maxTilt, Math.min(maxTilt, tiltX));
            const clampedTiltY = Math.max(-maxTilt, Math.min(maxTilt, tiltY));
            
            // Преобразуем градусы в радианы и инвертируем оси
            targetRotationZ = -clampedTiltX * (Math.PI / 180);
            targetRotationX = clampedTiltY * (Math.PI / 180);
        }

        // Альтернативное управление мышью
        function handleMouseMove(event) {
            const x = (event.clientX / window.innerWidth - 0.5) * 2;
            const y = -(event.clientY / window.innerHeight - 0.5) * 2;
            
            document.getElementById('tiltX').textContent = (x * maxTilt).toFixed(1);
            document.getElementById('tiltY').textContent = (y * maxTilt).toFixed(1);
            
            targetRotationZ = x * maxTilt * (Math.PI / 180);
            targetRotationX = y * maxTilt * (Math.PI / 180);
        }

        // Добавляем обработчики событий
        if ('onpointermove' in window) {
            document.addEventListener('pointermove', handleTilt);
        } else {
            document.addEventListener('mousemove', handleMouseMove);
        }
        
        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            
            // Плавное изменение вращения
            pencilGroup.rotation.x += (targetRotationX - pencilGroup.rotation.x) * rotationSpeed;
            pencilGroup.rotation.z += (targetRotationZ - pencilGroup.rotation.z) * rotationSpeed;
            
            // Обеспечиваем, чтобы карандаш всегда касался поверхности
            pencilGroup.position.y = 0.5 - Math.sin(Math.abs(pencilGroup.rotation.x)) * 0.1 - Math.sin(Math.abs(pencilGroup.rotation.z)) * 0.1;
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
